name: Deploy to Vultr

# One deploy at a time: Next.js rejects concurrent `next build` against the same `.next` dir.
concurrency:
  group: deploy-vultr-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: bash /var/www/landscape/deploy.sh
